name: build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  windows-mingw:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-make

      - name: Build (make)
        shell: msys2 {0}
        run: |
          make CC=gcc

      - name: Smoke test
        shell: pwsh
        run: |
          if (!(Test-Path bin/udisktools.exe)) { throw "build output missing" }
          Write-Host "build OK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: udisktools-${{ github.sha }}
          path: bin/udisktools.exe
