[TOOLSINFO]
TITLE=U盘拷盘工具
VERSION=1.0.0
ADMINPASS= 1234                     ; 配置窗口管理员密码（或改用 ADMINPASS_HASH，二选一；留空=无密码保护）
TOPMOST=1                       ; 主窗口置顶初始状态：1=启动即置顶（缺省）；0=启动不置顶（仍可点复选框切换）
PRJNUM=1
PRJNAME1=GENERIC
DISPLAYNAME1=通用机型
DEFAULTMODEL=GENERIC            ; 程序启动时默认选中的机型


; ------------------------------------------------------------
; 机型 1：通用机型
; 功能：写入文件 + 格式化 + 读取并显示 readme.txt
; 按钮显示名：可将任一按钮的显示文字按机型自定义（如"写入标签"→"升级"）
; ------------------------------------------------------------
[GENERIC]
ENABLE_READ=1
ENABLE_WRITE=1
ENABLE_FORMAT=1
ENABLE_USBINFO=1
AUTO_COPY=0                     ; 自动复制：1=插盘自动复制（需 AUTORUN=1 或开启监控）；0=仅手动点[复制]
AUTO_TEST=0                     ; 自动测试：1=插盘自动执行读写测试；0=仅手动点[读写测试]
BTN_WRITELABEL=升级             ; 按钮显示名覆盖（缺省时用默认名"写入标签"）
; BTN_START=开始                ; 其余按钮同理：BTN_START/BTN_STOP/BTN_FORMAT/BTN_READLABEL/...
WRITEMODE=COPY                  ; 简单复制
SRCPATH=.\upgrade_GENERIC\*.*          ; 写入源（支持通配符；按现场路径修改）
DSTPATH=\upgrade\                       ; 复制到 U 盘根目录
READFILE=SYSTEM\PAW6K-LSN
MATCH_POLICY=NEWEST
READPATTERN=WILDCARD
READRULE=MIN_LEN:1              ; 通用机型仅要求文件非空，可按需追加 MUST_CONTAIN:关键字
CONFIRM=1                       ; 格式化前弹窗确认
FILESYSTEM=FAT32
VOLUME=                         ; 格式化/写标签时的卷标，按需填写
HASH=md5
