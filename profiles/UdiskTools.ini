; ============================================================
; UdiskTools v1.0.0 初始参考配置文件
; 路径：与 UdiskTools.exe 同目录
; 机型：4 种（通用机型 / WT2 / N2010 / K2311(S3)）
; 说明：PRJNAMEn 为内部键（与节名一一对应，程序结构依赖，永不改动）；
;       DISPLAYNAMEn 为界面显示名，可随时修改，不影响程序。
; ============================================================

[TOOLSINFO]
TITLE=U盘拷盘工具
VERSION=1.0.0
ADMINPASS= 1234                     ; 配置窗口管理员密码（或改用 ADMINPASS_HASH，二选一；留空=无密码保护）
TOPMOST=1                       ; 主窗口置顶初始状态：1=启动即置顶（缺省）；0=启动不置顶（仍可点复选框切换）
PRJNUM=4
PRJNAME1=GENERIC
PRJNAME2=WT-2
PRJNAME3=N2010
PRJNAME4=K2311-S3
DISPLAYNAME1=通用机型
DISPLAYNAME2=WT-2机型
DISPLAYNAME3=N2010机型
DISPLAYNAME4=K2311(S3)机型
DEFAULTMODEL=GENERIC            ; 程序启动时默认选中的机型


; ------------------------------------------------------------
; 机型 1：通用机型
; 功能：写入文件 + 格式化 + 读取并显示 readme.txt
; 按钮显示名：可将任一按钮的显示文字按机型自定义（如"写入标签"→"升级"）
; ------------------------------------------------------------
[GENERIC]
ENABLE_READ=1
ENABLE_WRITE=1
ENABLE_FORMAT=1
ENABLE_USBINFO=1
AUTO_COPY=1                     ; 自动复制：1=插盘自动复制（需 AUTORUN=1 或开启监控）；0=仅手动点[复制]
AUTO_TEST=0                     ; 自动测试：1=插盘自动执行读写测试；0=仅手动点[读写测试]
BTN_WRITELABEL=升级             ; 按钮显示名覆盖（缺省时用默认名"写入标签"）
; BTN_START=开始                ; 其余按钮同理：BTN_START/BTN_STOP/BTN_FORMAT/BTN_READLABEL/...
WRITEMODE=COPY                  ; 简单复制
SRCPATH=.\upgrade_GENERIC\*.*          ; 写入源（支持通配符；按现场路径修改）
DSTPATH=\upgrade\                       ; 复制到 U 盘根目录
READFILE=SYSTEM\PAW6K-LSN
MATCH_POLICY=NEWEST
READPATTERN=WILDCARD
READRULE=MIN_LEN:1              ; 通用机型仅要求文件非空，可按需追加 MUST_CONTAIN:关键字
CONFIRM=1                       ; 格式化前弹窗确认
FILESYSTEM=FAT32
VOLUME=                         ; 格式化/写标签时的卷标，按需填写
HASH=md5

; ------------------------------------------------------------
; 机型 2：WT-2机型
; 功能：读取 1_4_0_3.ID（固定文件名）
; ------------------------------------------------------------
[WT-2]
ENABLE_READ=1
ENABLE_WRITE=0
ENABLE_FORMAT=0
ENABLE_USBINFO=1
AUTO_COPY=1                     ; 自动复制：1=插盘自动复制（需 AUTORUN=1 或开启监控）；0=仅手动点[复制]
AUTO_TEST=0                     ; 自动测试：1=插盘自动执行读写测试；0=仅手动点[读写测试]
; BTN_* 按钮显示名本机型未自定义，全部使用默认名
WRITEMODE=COPY
SRCPATH=.\upgrade_k2411\1.4.0.3\*.*          ; 写入源（支持通配符；按现场路径修改）
DSTPATH=\upgrade\                       ; 复制到 U 盘根目录
READFILE=1_4_0_3.ID             ; 固定文件名
MATCH_POLICY=NEWEST
READPATTERN=WILDCARD
;READRULE=MUST_CONTAIN:K2411     ; 示例判定规则：内容须含 K2411 标识，按实际调整
CONFIRM=1
FILESYSTEM=EXFAT
VOLUME=
HASH=md5

; ------------------------------------------------------------
; 机型 3：N2010机型
; 功能：读取并显示 8685XXXX.txt（XXXX 为可变部分，每次换盘不同）
; ------------------------------------------------------------
[N2010]
ENABLE_READ=1
ENABLE_WRITE=0
ENABLE_FORMAT=0
ENABLE_USBINFO=1
AUTO_COPY=1                     ; 自动复制：1=插盘自动复制（需 AUTORUN=1 或开启监控）；0=仅手动点[复制]
AUTO_TEST=0                     ; 自动测试：1=插盘自动执行读写测试；0=仅手动点[读写测试]
WRITEMODE=COPY
READFILE=N2010.ver          ; 通配符：8685 + 恰好 4 个任意字符（可变序列号尾号）
MATCH_POLICY=NEWEST             ; 多个命中时取最新的一个
READPATTERN=WILDCARD            ; 也可改用 REGEX：^8685\d{4}\.txt$
;READRULE=MUST_CONTAIN:8685;MIN_LEN:10
; 命中的可变部分（???? 对应的 4 位）自动捕获为 ${MATCH_1}，可用于日志与判定
CONFIRM=1
FILESYSTEM=EXFAT
VOLUME=
HASH=md5

; ------------------------------------------------------------
; 机型 4：K2311-(S3)机型
; 功能：暂按"可写入 + 可读取"初始配置，具体文件名与规则待确认后修改
; ------------------------------------------------------------
[K2311-S3]
ENABLE_READ=1
ENABLE_WRITE=1
ENABLE_FORMAT=0
ENABLE_USBINFO=1
AUTO_COPY=1                     ; 自动复制：1=插盘自动复制（需 AUTORUN=1 或开启监控）；0=仅手动点[复制]
AUTO_TEST=0                     ; 自动测试：1=插盘自动执行读写测试；0=仅手动点[读写测试]
WRITEMODE=COPY
SRCPATH=.\upgrade_k2311\v1.4.1.2\*.*          ; 写入源，按现场路径修改
DSTPATH=\
READFILE=PAWS3.LSN                       ; ← 待确认：K2311(S3) 需读取的文件名（支持通配符）
MATCH_POLICY=NEWEST
READPATTERN=WILDCARD
READRULE=                       ; ← 待确认：读取判定规则
CONFIRM=1
FILESYSTEM=EXFAT
VOLUME=
HASH=md5
