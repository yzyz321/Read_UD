; ============================================================
; UdiskTools v1.0.0 配置文件（详细说明见 docs/配置文件使用手册.md）
; 位置：与 UdiskTools.exe 同目录，文件名必须为 UdiskTools.ini
; 编码：UTF-8（推荐）/ UTF-16 / ANSI 自动识别；';' 后为注释
;
; 路径规则（v1.0.0-alpha.7 起）：
;   * SRCPATH 支持绝对路径（如 D:\src\*.img）和相对路径（相对 exe 所在目录）
;   * DSTPATH 为 U 盘内目标目录；目录不存在时自动逐级建立
;   * 复制时目标文件已存在则自动覆盖
; 机型命名双层映射：
;   * PRJNAMEn = 内部键（与节名一致，程序依赖，永不改动）
;   * DISPLAYNAMEn = 界面显示名（可随时修改，不影响程序）
; ============================================================

[TOOLSINFO]
TITLE=U盘拷盘工具               ; 窗口标题
VERSION=1.0.0                   ; 版本号（标题栏+日志显示）
ADMINPASS=                      ; 配置窗口管理员密码；留空=无密码保护（配置窗口仅只读）
PRJNUM=4                        ; 机型数量
PRJNAME1=GENERIC                ; 机型1内部键（=节名）
PRJNAME2=WT3
PRJNAME3=N2010
PRJNAME4=K2511S4
DISPLAYNAME1=通用机型           ; 机型1显示名（下拉框显示，可随意改）
DISPLAYNAME2=WT3机型
DISPLAYNAME3=N2010机型
DISPLAYNAME4=K2511(S4)机型
DEFAULTMODEL=GENERIC            ; 启动时默认选中的机型（内部键）

; ------------------------------------------------------------
; 机型 1：通用机型
; 功能：写入文件 + 格式化 + 读取显示 readme.txt
; 注意：BTN_WRITELABEL=升级 —— 该按钮是"复制文件"按钮（成功绿 Copy Complete! / 失败红 Copy Failure!）
;       磁盘卷标没有独立写标签功能：卷标在"格式化"时按 VOLUME 键写入
; ------------------------------------------------------------
[GENERIC]
ENABLE_READ=1                   ; 读取（读取+判定）开关：0=禁用（按钮置灰/自动跳过）
ENABLE_WRITE=1                  ; 写入（复制）开关
ENABLE_FORMAT=1                 ; 格式化开关
ENABLE_USBINFO=1                ; USB 通讯模式识别开关
AUTORUN=0                       ; 插盘自动执行：1=插入U盘立即执行任务；0=仅监控开启时自动
BTN_WRITELABEL=升级             ; 按钮显示名覆盖（缺省用默认名"写入标签"；此按钮实际执行复制）
WRITEMODE=COPY                  ; COPY=简单复制（PROCESSED 为后续版本功能）
SRCPATH=.\copy_src\*.*          ; 复制源：绝对/相对路径均可（相对=相对 exe 目录），支持通配符
DSTPATH=\                       ; 复制目标（U 盘内目录，不存在自动建立；\ =U盘根目录）
READFILE=readme.txt             ; 读取的文件（U盘根目录；支持通配符如 GTB907785*.txt）
MATCH_POLICY=NEWEST             ; 多个命中时：NEWEST=取最新 / FIRST=第一个 / STRICT=多命中报错
READPATTERN=WILDCARD            ; WILDCARD(* ? 通配符)；REGEX 为后续版本支持
READRULE=MIN_LEN:1              ; 判定规则（分号分隔）：MUST_CONTAIN:关键字; MIN_LEN:最小长度
CONFIRM=1                       ; 格式化前弹窗确认：1=确认
FILESYSTEM=FAT32                ; 格式化文件系统：FAT32 / EXFAT
VOLUME=                         ; 格式化后写入的卷标（留空=不改卷标）
HASH=md5                        ; 复制校验算法：md5（复制前后 MD5 比对）

; ------------------------------------------------------------
; 机型 2：WT3机型 —— 读取 K2411TX.ID（固定文件名）
; ------------------------------------------------------------
[WT3]
ENABLE_READ=1
ENABLE_WRITE=0                  ; 禁用写入（复制按钮置灰）
ENABLE_FORMAT=0                 ; 禁用格式化
ENABLE_USBINFO=1
AUTORUN=0
WRITEMODE=COPY
READFILE=K2411TX.ID
MATCH_POLICY=NEWEST
READPATTERN=WILDCARD
READRULE=MUST_CONTAIN:K2411     ; 内容须包含 K2411，判定通过才显示
CONFIRM=1
FILESYSTEM=EXFAT
VOLUME=
HASH=md5

; ------------------------------------------------------------
; 机型 3：N2010机型 —— 通配符读取 8685XXXX.txt
; XXXX 为可变部分（每次换盘不同），命中后自动捕获为 ${MATCH_1}
; ------------------------------------------------------------
[N2010]
ENABLE_READ=1
ENABLE_WRITE=0
ENABLE_FORMAT=0
ENABLE_USBINFO=1
AUTORUN=0
WRITEMODE=COPY
READFILE=8685????.txt           ; 8685 + 恰好 4 个任意字符 + .txt
MATCH_POLICY=NEWEST
READPATTERN=WILDCARD
READRULE=MUST_CONTAIN:8685;MIN_LEN:10
CONFIRM=1
FILESYSTEM=EXFAT
VOLUME=
HASH=md5

; ------------------------------------------------------------
; 机型 4：K2511(S4)机型 —— READFILE/READRULE 待确认后填入
; ------------------------------------------------------------
[K2511S4]
ENABLE_READ=1
ENABLE_WRITE=1
ENABLE_FORMAT=0
ENABLE_USBINFO=1
AUTORUN=0
WRITEMODE=COPY
SRCPATH=.\copy_src\*.*          ; 写入源，按现场修改
DSTPATH=\
READFILE=                       ; ← 待确认：需读取的文件名（支持通配符）
MATCH_POLICY=NEWEST
READPATTERN=WILDCARD
READRULE=                       ; ← 待确认：读取判定规则
CONFIRM=1
FILESYSTEM=EXFAT
VOLUME=
HASH=md5
